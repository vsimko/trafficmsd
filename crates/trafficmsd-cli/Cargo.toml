[package]
name = "trafficmsd-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Command-line interface for the TrafficMSD simulation engine"

[[bin]]
name = "trafficmsd"
path = "src/main.rs"

[dependencies]
trafficmsd-core = { path = "../trafficmsd-core" }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
