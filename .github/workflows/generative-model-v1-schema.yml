name: Generative model v1 schema and semantic validation

on:
  pull_request:
    branches: [master, main]
    paths:
      - ".github/workflows/generative-model-v1-schema.yml"
      - "schemas/generative-model/v1/**"
      - "scripts/validate_generative_model_v1.py"
      - "tests/python/test_generative_model_v1.py"
      - "experiments/generative-model-v1-sparse-marks/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: generative-model-v1-schema-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Schema and semantic invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema and audit dependencies
        run: python -m pip install --disable-pip-version-check "jsonschema>=4.20,<5" "numpy>=1.26,<3"
      - name: Download immutable Westermo extraction artifact
        uses: actions/download-artifact@v4
        with:
          name: westermo-model-extraction-and-qpn-v1
          repository: vsimko/trafficmsd
          run-id: 43079950800
          github-token: ${{ github.token }}
          path: artifacts
      - name: Re-run cutoff sensitivity audit against immutable training artifact
        run: |
          python experiments/generative-model-v1-sparse-marks/audit_cutoff_sensitivity.py artifacts/westermo-model-extraction-v1/trace.csv --output /tmp/cutoff-sensitivity-results.json
          cmp /tmp/cutoff-sensitivity-results.json experiments/generative-model-v1-sparse-marks/cutoff-sensitivity-results.json
      - name: Compile sparse mark comparison experiment
        run: python -m py_compile experiments/generative-model-v1-sparse-marks/compare_gamma_lognormal.py
      - name: Compile occurrence Markov support audit
        run: python -m py_compile experiments/generative-model-v1-sparse-marks/audit_occurrence_markov.py
      - name: Compile cutoff sensitivity audit
        run: python -m py_compile experiments/generative-model-v1-sparse-marks/audit_cutoff_sensitivity.py
      - name: Run semantic validation tests
        run: python -m unittest discover -s tests/python -p "test_generative_model_v1.py" -v
