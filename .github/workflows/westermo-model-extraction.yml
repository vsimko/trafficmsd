name: Westermo model extraction

on:
  pull_request:
    branches: [master]
    paths:
      - "scripts/datasets/extract_westermo.py"
      - "tests/python/**"
      - "experiments/model-extraction-v1/**"
      - ".github/workflows/westermo-model-extraction.yml"
      - "schemas/model/v1/model.schema.json"
      - "schemas/model/v2/model.schema.json"
      - "R/model-export-v2.R"
      - "crates/trafficmsd-core/src/model_v2.rs"
      - "schemas/evaluation/v1/result.schema.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: westermo-extraction-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install tshark
        timeout-minutes: 5
        run: |
          if ! command -v tshark >/dev/null 2>&1; then
            sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=30
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          fi

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
          extra-packages: any::jsonlite
          cache-version: 1

      - name: Install TrafficMSD
        run: R CMD INSTALL .

      - name: Install JSON Schema validator
        run: python -m pip install jsonschema

      - name: Test deterministic packet binning
        run: python -m unittest discover -s tests/python -v

      - name: Download, verify and aggregate Westermo packets
        run: python scripts/datasets/extract_westermo.py

      - name: Fit model and evaluate observed interval
        run: |
          Rscript experiments/model-extraction-v1/run-westermo.R \
            artifacts/westermo-model-extraction-v1/trace.csv \
            artifacts/westermo-model-extraction-v1/manifest.json \
            artifacts/westermo-model-extraction-v1/model

      - name: Analyze cutoff sensitivity on the full-trace diagnostic
        run: |
          Rscript experiments/model-extraction-v1/analyze-cutoff-sensitivity.R \
            artifacts/westermo-model-extraction-v1/trace.csv \
            artifacts/westermo-model-extraction-v1/manifest.json \
            artifacts/westermo-model-extraction-v1/model

      - name: Evaluate contiguous train/validation/test segments
        run: |
          Rscript experiments/model-extraction-v1/evaluate-contiguous-holdout.R \
            artifacts/westermo-model-extraction-v1/trace.csv \
            artifacts/westermo-model-extraction-v1/manifest.json \
            artifacts/westermo-model-extraction-v1/model

      - name: Validate model and evaluation contracts
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          from pathlib import Path

          artifact_dir = Path("artifacts/westermo-model-extraction-v1/model")
          pairs = [
              ("schemas/model/v1/model.schema.json",
               [artifact_dir / "model-v1.json"]),
              ("schemas/evaluation/v1/result.schema.json",
               [artifact_dir / "evaluation-result-v1.json"]),
          ]

          # Holdout now exports one sparse v2 model per validation candidate
          # and one per validation-Pareto candidate on test. Validate every
          # generated candidate rather than expecting the removed singleton
          # model-v2-test.json artifact.
          v2_candidates = sorted(artifact_dir.glob("model-v2-*.json"))
          if not v2_candidates:
              raise SystemExit("No sparse model v2 candidate artifacts were produced.")
          pairs.append(("schemas/model/v2/model.schema.json", v2_candidates))

          for schema_path, document_paths in pairs:
              schema = json.loads(Path(schema_path).read_text())
              validator = Draft202012Validator(schema)
              for document_path in document_paths:
                  document = json.loads(document_path.read_text())
                  errors = sorted(validator.iter_errors(document),
                                  key=lambda error: list(error.path))
                  if errors:
                      raise SystemExit("\\n".join(
                          f"{document_path}: {list(error.path)}: {error.message}"
                          for error in errors
                      ))
                  print(f"Validated {document_path} against {schema_path}")
          PY

      - name: Upload reproducible extraction outputs
        uses: actions/upload-artifact@v7
        with:
          name: westermo-model-extraction-v1
          path: artifacts/westermo-model-extraction-v1/
          if-no-files-found: error
