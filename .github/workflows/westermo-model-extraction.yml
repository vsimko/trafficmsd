name: Westermo model extraction and QPN workload evaluation

on:
  pull_request:
    branches: [master]
    paths:
      - "scripts/datasets/extract_westermo.py"
      - "tests/python/**"
      - "experiments/model-extraction-v1/**"
      - "experiments/qpn-workload-evaluation-v1/**"
      - "scripts/build_qpn_workload_schedules.py"
      - "scripts/line_qpn_trace_evaluation.py"
      - "scripts/line_qpn_analytical_control.py"
      - "scripts/summarize_qpn_workload_evaluation.py"
      - ".github/workflows/westermo-model-extraction.yml"
      - "schemas/model/v1/model.schema.json"
      - "schemas/model/v2/model.schema.json"
      - "R/model-export-v2.R"
      - "crates/trafficmsd-core/src/model_v2.rs"
      - "schemas/evaluation/v1/result.schema.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: westermo-extraction-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install tshark
        timeout-minutes: 5
        run: |
          if ! command -v tshark >/dev/null 2>&1; then
            sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=30
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          fi

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
          extra-packages: any::jsonlite
          cache-version: 1

      - name: Install TrafficMSD
        run: R CMD INSTALL .

      - name: Set up Python for LINE
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java for LINE LDES
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install schema and LINE dependencies
        run: python -m pip install --disable-pip-version-check "jsonschema>=4.20,<5" "line-solver==3.0.8.0"

      - name: Test deterministic packet binning
        run: python -m unittest discover -s tests/python -v

      - name: Download, verify and aggregate Westermo packets
        run: python scripts/datasets/extract_westermo.py

      - name: Fit model and evaluate observed interval
        run: |
          Rscript experiments/model-extraction-v1/run-westermo.R \
            artifacts/westermo-model-extraction-v1/trace.csv \
            artifacts/westermo-model-extraction-v1/manifest.json \
            artifacts/westermo-model-extraction-v1/model

      - name: Analyze cutoff sensitivity on the full-trace diagnostic
        run: |
          Rscript experiments/model-extraction-v1/analyze-cutoff-sensitivity.R \
            artifacts/westermo-model-extraction-v1/trace.csv \
            artifacts/westermo-model-extraction-v1/manifest.json \
            artifacts/westermo-model-extraction-v1/model

      - name: Evaluate contiguous train/validation/test segments
        run: |
          Rscript experiments/model-extraction-v1/evaluate-contiguous-holdout.R \
            artifacts/westermo-model-extraction-v1/trace.csv \
            artifacts/westermo-model-extraction-v1/manifest.json \
            artifacts/westermo-model-extraction-v1/model

      - name: Build checksummed measured and deterministic-replay QPN schedules
        run: |
          python scripts/build_qpn_workload_schedules.py \
            --source-csv artifacts/westermo-model-extraction-v1/model/source-signal.csv \
            --replay-csv artifacts/westermo-model-extraction-v1/model/reconstructed-signal.csv \
            --source-manifest artifacts/westermo-model-extraction-v1/manifest.json \
            --output-dir artifacts/qpn-workload-evaluation-v1

      - name: Run measured-trace QPN condition
        env:
          LINE_LDES_FORCE_JAR: "1"
        run: |
          python scripts/line_qpn_trace_evaluation.py \
            --experiment artifacts/qpn-workload-evaluation-v1/measured-experiment.json \
            --schedule artifacts/qpn-workload-evaluation-v1/measured-arrival-schedule.json \
            --model-spec artifacts/qpn-workload-evaluation-v1/resolved-model-spec.json \
            --output-dir artifacts/qpn-workload-evaluation-v1/measured

      - name: Run deterministic-replay QPN condition
        env:
          LINE_LDES_FORCE_JAR: "1"
        run: |
          python scripts/line_qpn_trace_evaluation.py \
            --experiment artifacts/qpn-workload-evaluation-v1/replay-experiment.json \
            --schedule artifacts/qpn-workload-evaluation-v1/replay-arrival-schedule.json \
            --model-spec artifacts/qpn-workload-evaluation-v1/resolved-model-spec.json \
            --output-dir artifacts/qpn-workload-evaluation-v1/replay

      - name: Derive measured offered job rate for the analytical control
        id: measured-rate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          manifest = json.loads(Path("artifacts/qpn-workload-evaluation-v1/manifest.json").read_text())
          condition = manifest["conditions"]["measured"]
          print(f"arrival_rate={condition['total_jobs'] / condition['horizon']:.17g}")
          PY

      - name: Run Poisson M/M/1 analytical QPN control
        env:
          LINE_LDES_FORCE_JAR: "1"
        run: |
          python scripts/line_qpn_analytical_control.py \
            --arrival-rate "${{ steps.measured-rate.outputs.arrival_rate }}" \
            --model-spec artifacts/qpn-workload-evaluation-v1/resolved-model-spec.json \
            --output artifacts/qpn-workload-evaluation-v1/analytical-control/result.json

      - name: Summarize measured versus deterministic replay outcomes
        run: |
          python scripts/summarize_qpn_workload_evaluation.py \
            --manifest artifacts/qpn-workload-evaluation-v1/manifest.json \
            --measured-result artifacts/qpn-workload-evaluation-v1/measured/result.json \
            --replay-result artifacts/qpn-workload-evaluation-v1/replay/result.json \
            --control-result artifacts/qpn-workload-evaluation-v1/analytical-control/result.json \
            --control-config experiments/qpn-workload-evaluation-v1/analytical-control.json \
            --output-dir artifacts/qpn-workload-evaluation-v1/report

      - name: Validate model and evaluation contracts
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          from pathlib import Path

          pairs = [
              ("schemas/model/v1/model.schema.json",
               "artifacts/westermo-model-extraction-v1/model/model-v1.json"),
              ("schemas/model/v2/model.schema.json",
               "artifacts/westermo-model-extraction-v1/model/model-v2-test.json"),
              ("schemas/evaluation/v1/result.schema.json",
               "artifacts/westermo-model-extraction-v1/model/evaluation-result-v1.json"),
          ]
          for schema_path, document_path in pairs:
              schema = json.loads(Path(schema_path).read_text())
              document = json.loads(Path(document_path).read_text())
              errors = sorted(Draft202012Validator(schema).iter_errors(document),
                              key=lambda error: list(error.path))
              if errors:
                  raise SystemExit("\\n".join(
                      f"{document_path}: {list(error.path)}: {error.message}"
                      for error in errors
                  ))
              print(f"Validated {document_path} against {schema_path}")
          PY

      - name: Upload reproducible extraction and QPN evaluation outputs
        uses: actions/upload-artifact@v7
        with:
          name: westermo-model-extraction-and-qpn-v1
          path: |
            artifacts/westermo-model-extraction-v1/
            artifacts/qpn-workload-evaluation-v1/
          if-no-files-found: error
