name: R unit tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (R ${{ matrix.r }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        r: ['release', 'devel']
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
          extra-packages: any::covr, any::DT, any::htmltools
          cache-version: 1

      - name: Run testthat suite
        run: Rscript -e 'testthat::test_local(reporter = "summary")'

      - name: Generate coverage report
        if: matrix.r == 'release'
        run: |
          Rscript -e 'cov <- covr::package_coverage(); print(cov); covr::report(cov, file = "coverage.html")'

      - name: Upload coverage report
        if: always() && matrix.r == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage.html
          if-no-files-found: ignore
