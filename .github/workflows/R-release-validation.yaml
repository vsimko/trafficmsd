name: R release validation

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to validate (manual runs only)
        required: false
        default: master

permissions:
  contents: read

concurrency:
  group: r-release-validation-${{ github.workflow }}-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Build, install and check source package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
          extra-packages: any::rcmdcheck, any::remotes
          cache-version: 1

      - name: Build source package
        run: R CMD build .

      - name: Install source package
        shell: bash
        run: |
          PACKAGE_TARBALL=$(ls -1 trafficmsd_*.tar.gz | head -n 1)
          R_LIB=$(Rscript -e 'cat(.libPaths()[1])')
          R CMD INSTALL --library="${R_LIB}" "${PACKAGE_TARBALL}"
          Rscript -e 'library(trafficmsd, lib.loc = .libPaths()[1]); packageVersion("trafficmsd")'

      - name: Verify installation from GitHub
        env:
          GITHUB_PAT: ${{ github.token }}
          REF: ${{ inputs.ref || github.sha }}
        run: |
          Rscript -e 'lib <- .libPaths()[1]; remotes::install_github(paste0("vsimko/trafficmsd@", Sys.getenv("REF")), lib = lib, upgrade = "never")'
          Rscript -e 'library(trafficmsd, lib.loc = .libPaths()[1]); packageVersion("trafficmsd")'

      - name: Check source package
        shell: bash
        run: |
          PACKAGE_TARBALL=$(ls -1 trafficmsd_*.tar.gz | head -n 1)
          R CMD check --as-cran --no-manual "${PACKAGE_TARBALL}"

      - name: Upload source package and check log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validated-r-source-package
          path: |
            trafficmsd_*.tar.gz
            trafficmsd.Rcheck/00check.log
          if-no-files-found: ignore
