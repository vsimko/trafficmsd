name: Generative fidelity v1

on:
  push:
    branches: [master, main]
    paths:
      - "experiments/generative-fidelity-v1/**"
      - ".github/workflows/generative-fidelity-v1.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "experiments/generative-fidelity-v1/**"
      - ".github/workflows/generative-fidelity-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metrics:
    name: Generative fidelity metric tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Test metric invariants
        run: Rscript experiments/generative-fidelity-v1/tests.R
