name: Model extraction smoke experiment

on:
  push:
    branches: [master, main, "feature/**", "research/**"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-extraction-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Reproduce synthetic model extraction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
          extra-packages: any::jsonlite
          cache-version: 1

      - name: Install TrafficMSD
        run: R CMD INSTALL .

      - name: Run deterministic extraction and evaluation
        run: Rscript experiments/model-extraction-v1/run.R artifacts/model-extraction-v1

      - name: Check result JSON structure
        run: |
          Rscript -e 'x <- jsonlite::fromJSON("artifacts/model-extraction-v1/evaluation-result-v1.json"); stopifnot(x$schema_version == "1.0", length(x$results) == 1L, x$results[[1]]$status == "success", is.finite(x$results[[1]]$metrics$fidelity$rmse))'

      - name: Upload experiment artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: model-extraction-v1-smoke
          path: artifacts/model-extraction-v1/
          if-no-files-found: error
