name: R-Rust conformance

on:
  push:
    branches: [master, main, "feature/**", "research/**"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-rust-conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: R reference versus Rust CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
          extra-packages: any::jsonlite
          cache-version: 1

      - name: Build standalone CLI
        run: cargo build --release --bin trafficmsd

      - name: Install R reference package
        run: R CMD INSTALL .

      - name: Compare R and Rust outputs
        run: Rscript tests/conformance/rust-r-conformance.R target/release/trafficmsd
