name: Westermo dataset release

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/westermo-dataset.yml"
      - "scripts/datasets/validate_westermo.py"
      - "docs/datasets/westermo.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: westermo-dataset-release
  cancel-in-progress: false

jobs:
  acquire-validate-release:
    # Dataset publication is intentionally restricted to the default branch.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve immutable upstream dataset revision
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git ls-remote https://github.com/westermo/network-traffic-dataset.git refs/heads/main | cut -f1)"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve the Westermo upstream revision." >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Cache Westermo source downloads
        uses: actions/cache@v6
        with:
          path: .cache/westermo
          key: westermo-dataset-${{ steps.upstream.outputs.revision }}-${{ hashFiles('scripts/datasets/validate_westermo.py') }}

      - name: Install packet capture inspection tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark

      - name: Download Westermo reduced captures and event log
        shell: bash
        env:
          UPSTREAM_REVISION: ${{ steps.upstream.outputs.revision }}
        run: |
          set -euo pipefail
          mkdir -p .cache/westermo dist/westermo
          base="https://raw.githubusercontent.com/westermo/network-traffic-dataset/$UPSTREAM_REVISION"
          fetch_if_missing() {
            local path="$1"
            local url="$2"
            if [[ ! -s "$path" ]]; then
              curl --fail --location --retry 5 --retry-all-errors --output "$path" "$url"
            fi
            test -s "$path"
          }
          fetch_if_missing .cache/westermo/westermo-right.zip "$base/data/reduced/pcaps/right.zip"
          fetch_if_missing .cache/westermo/westermo-left.zip "$base/data/reduced/pcaps/left.zip"
          fetch_if_missing .cache/westermo/westermo-bottom.zip "$base/data/reduced/pcaps/bottom.zip"
          fetch_if_missing .cache/westermo/events.txt "$base/data/events.txt"
          cp .cache/westermo/* dist/westermo/
          test -s dist/westermo/events.txt

      - name: Validate ZIP archives and inspect packet captures
        run: |
          python scripts/datasets/validate_westermo.py dist/westermo

      - name: Generate checksums and release manifest
        shell: bash
        env:
          UPSTREAM_REVISION: ${{ steps.upstream.outputs.revision }}
        run: |
          set -euo pipefail
          cd dist/westermo
          sha256sum westermo-right.zip westermo-left.zip westermo-bottom.zip events.txt > SHA256SUMS
          cat > manifest.yaml <<EOF
          dataset: Westermo Network Traffic Dataset
          upstream: https://github.com/westermo/network-traffic-dataset
          upstream_version: "1.0"
          upstream_revision: "$UPSTREAM_REVISION"
          license: CC-BY-4.0
          license_url: https://creativecommons.org/licenses/by/4.0/
          citation: "Per Erik Strandberg et al., Westermo Network Traffic Dataset, April 2023."
          files:
            - westermo-right.zip
            - westermo-left.zip
            - westermo-bottom.zip
            - events.txt
          validation: validation-report.json
          checksums: SHA256SUMS
          notes:
            - "Reduced PCAP archives; inspect the validation report for per-capture packet counts and metadata."
            - "Multiple observation points may contain duplicate packets."
            - "Event markers describe time windows and are not packet-level ground truth."
          EOF

      - name: Publish versioned dataset release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dataset-westermo-v1.0
          name: Westermo dataset v1.0
          target_commitish: master
          body_path: docs/datasets/westermo.md
          files: |
            dist/westermo/westermo-right.zip
            dist/westermo/westermo-left.zip
            dist/westermo/westermo-bottom.zip
            dist/westermo/events.txt
            dist/westermo/SHA256SUMS
            dist/westermo/manifest.yaml
            dist/westermo/validation-report.json
          overwrite_files: true
          fail_on_unmatched_files: true
