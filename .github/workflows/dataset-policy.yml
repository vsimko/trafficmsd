name: Dataset storage policy

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: dataset-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Enforce aggregate committed dataset limit
        run: python scripts/ci/check-dataset-size.py
