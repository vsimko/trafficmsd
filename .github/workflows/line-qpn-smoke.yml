name: LINE QPN smoke test

on:
  push:
    branches: [feat/line-solver-integration]
    paths:
      - ".github/workflows/line-qpn-smoke.yml"
      - "experiments/line-qpn-v1/**"
      - "scripts/line_qpn_smoke.py"
      - "docs/line-solver-validation.md"
  pull_request:
    branches: [master, main]
    paths:
      - ".github/workflows/line-qpn-smoke.yml"
      - "experiments/line-qpn-v1/**"
      - "scripts/line_qpn_smoke.py"
      - "docs/line-solver-validation.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: line-qpn-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: LINE ${{ matrix.python-version }} / headless QPN
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The bundled Linux x86-64 LDES binary is the primary engine. Java is
      # installed as the documented fallback if that native executable cannot run.
      - name: Set up Java fallback
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pinned LINE release
        run: python -m pip install --disable-pip-version-check "line-solver==3.0.8.0"

      - name: Run deterministic QPN experiment and assertions
        run: python scripts/line_qpn_smoke.py

      - name: Upload model and result evidence
        uses: actions/upload-artifact@v4
        with:
          name: line-qpn-v1-${{ github.run_id }}
          path: artifacts/line-qpn-v1/
          if-no-files-found: error
          retention-days: 30
